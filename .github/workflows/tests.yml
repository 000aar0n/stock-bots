name: Bot regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/monitor.test.cjs
      - run: node --check docs/monitor.js && node --check docs/city-3d.js
